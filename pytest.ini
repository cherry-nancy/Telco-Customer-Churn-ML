[pytest]
testpaths = tests # tells pytest to look in tests/ when you don't name a path
# repo root on sys.path so "from src.x import y" works, like uvicorn src.app.main:app
pythonpath = .  # adds the root folder to Python's import path.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning


